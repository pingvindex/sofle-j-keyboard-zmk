name: Build ZMK Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"

jobs:
  build:
    name: Build ZMK Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for upstream sync

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --user west
          west init -l config
          west update
          west zephyr-export

      - name: Clean Previous Builds
        run: west build -t clean || true

      - name: Build Firmware
        uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  draw:
    name: Generate Keymap Image
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the generated images
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Draw Keymap
        uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
        with:
          commit_message: "[Draw] ${{ github.event.head_commit.message }}"
          amend_commit: false
          install_branch: "main"
          keymap_patterns: "config/*.keymap"
          json_path: "config"
          config_path: "keymap_drawer.config.yaml"
          output_folder: "keymap-drawer"
          destination: "both"
          parse_args: ""
          draw_args: ""

      - name: Verify Keymap Output
        run: |
          if [ ! -d "keymap-drawer" ]; then
            echo "Keymap output folder missing!"
            exit 1
          fi

      - name: Commit and Push Keymap Images
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
          git add keymap-drawer/*
          git commit -m "[Auto] Update keymap images" || exit 0
          git push

